# Run `pre-commit install` once after cloning to wire up the hooks.
# Then every `git commit` will run these checks automatically.
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1   # pin to a release; check for newer at github.com/antonbabenko/pre-commit-terraform/releases
    hooks:
      - id: terraform_fmt

      - id: terraform_validate
        args:
          - --args=-backend=false

      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

      - id: terraform_checkov
        args:
          - --args=--framework terraform
          - --args=--quiet
          - --args=--compact
          - --args=--soft-fail-on MEDIUM
