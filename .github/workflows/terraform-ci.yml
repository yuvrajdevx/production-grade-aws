name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - network
          - nonprod
          - prod
          - shared-svcs
          - modules/vpc
          - modules/eks

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: terraform init (no backend)
        run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=${{ matrix.dir }} validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - network
          - nonprod
          - prod
          - shared-svcs
          - modules/vpc
          - modules/eks

    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint (download AWS ruleset plugin)
        # Pass --config so tflint finds .tflint.hcl at the repo root regardless
        # of which subdirectory we lint.
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run tflint
        run: tflint --format=compact --config="$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: ${{ matrix.dir }}

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - network
          - nonprod
          - prod
          - shared-svcs
          - modules/vpc
          - modules/eks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install checkov

      - name: Run checkov (advisory — findings logged, non-blocking)
        # --soft-fail makes checkov exit 0 even when findings exist.
        # This keeps checkov informational: every finding is visible in the CI
        # log, but known intentional trade-offs (single NAT GW, no VPC flow
        # logs, EKS public endpoint) don't block merges.
        # Remove --soft-fail and add --skip-check CKV_... lines to harden later.
        run: |
          checkov \
            --directory ${{ matrix.dir }} \
            --framework terraform \
            --quiet \
            --compact \
            --soft-fail
